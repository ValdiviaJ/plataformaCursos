version: '3.8'

services:
  # Database Service (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: codemaster-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: codemaster_courses
      POSTGRES_USER: codemaster_admin
      POSTGRES_PASSWORD: codemaster_secure_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - codemaster-network

  # Backend Service (Laravel API)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codemaster-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
    depends_on:
      - db
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: codemaster_courses
      DB_USERNAME: codemaster_admin
      DB_PASSWORD: codemaster_secure_password
    entrypoint:
      - sh
      - -c
      - |
        if [ ! -f .env ]; then
          cp .env.example .env
        fi
        composer install --no-interaction --prefer-dist --optimize-autoloader
        php artisan key:generate --force
        php artisan migrate --force
        php artisan db:seed --force
        php artisan serve --host=0.0.0.0 --port=8000
    networks:
      - codemaster-network

  # Frontend Service (React + Vite in Dev Mode)
  frontend:
    image: node:20-alpine
    container_name: codemaster-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://127.0.0.1:8000/api/v1
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    depends_on:
      - backend
    networks:
      - codemaster-network

volumes:
  pgdata:
    driver: local

networks:
  codemaster-network:
    driver: bridge
